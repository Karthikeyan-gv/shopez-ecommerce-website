# Render Blueprint Configuration for ShopEZ E-Commerce Platform
# Website: https://render.com
# Usage: Connect your GitHub repository to Render and choose "New Blueprint Instance" or "Web Service"

services:
  - type: web
    name: shopez-ecommerce
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URL
        sync: false # Set your MongoDB Atlas Connection String in Render Dashboard
      - key: JWT_SECRET
        generateValue: true # Generates a random secure key automatically
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
