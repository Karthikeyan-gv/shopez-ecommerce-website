# Render Blueprint for single-service deployment.
# This deploys ONE Web Service that serves both the frontend (built client) and the API.
# The server.js serves the built client/dist and the /api routes together.
#
# Alternative (two separate services) is also supported by the code:
#   - Static Site  : Root Directory: client, Build: npm install && npm run build, Publish: dist
#   - Web Service  : Root Directory: server, Start: node server.js
# If you use the two-service setup, set VITE_API_URL (frontend env) to your backend URL.

services:
  - type: web
    name: shopez-ecommerce-website
    runtime: node
    plan: free
    rootDir: .
    buildCommand: cd client && npm install && npm run build
    startCommand: cd server && npm install && node server.js
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
